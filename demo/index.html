<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>歌曲知识 · 离线交互预览</title>
<style>
  *{box-sizing:border-box}body{margin:0;font:14px/1.6 "Microsoft YaHei",sans-serif;background:#f3f3ef;color:#333} .preview-label{padding:20px 30px;color:#787d74;border-bottom:1px solid #dfe2da;background:#fafbf7;font-size:12px}.workspace{padding:55px;display:flex;align-items:center;gap:48px;height:calc(100vh - 140px)}.record{border:18px solid #2b2d2c;border-radius:50%;width:250px;height:250px;display:grid;place-items:center;background:repeating-radial-gradient(#313632 0 2px,#242825 3px 5px);box-shadow:0 10px 30px #26302422}.record span{width:100px;height:100px;border-radius:50%;background:#ba4852;color:#fff;display:grid;place-items:center;font-size:26px}.title{font-size:32px}.info{color:#737b70}.page-footer{height:80px;background:#fafbf8;border-top:1px solid #dfe2da;display:flex;align-items:center;padding:20px 40px}.vinyl-page-bar-wrapper{width:100%;display:flex;align-items:center;justify-content:space-between}.left{display:flex;align-items:center;gap:15px}.fake-icon{color:#788173;font-size:22px}.play{border:0;background:#bd343f;color:white;border-radius:50%;width:42px;height:42px;font-size:20px}.settings-preview{position:fixed;right:30px;top:15px;border:1px solid #ccc;border-radius:8px;background:white;padding:8px 15px;cursor:pointer}#page_pc_setting{padding:24px 40px;background:white}#page_pc_setting[hidden]{display:none}#page_pc_setting main{min-height:150px}.hint{color:#888;font-size:12px}
</style>
<div class="preview-label">歌曲知识 · 离线交互预览 / 此页使用模拟数据，不会连接网易云或调用付费 API</div>
<button class="settings-preview" onclick="document.getElementById('page_pc_setting').hidden=!document.getElementById('page_pc_setting').hidden">预览设置页</button>
<div class="VinylPageContainer_preview">
  <div id="page_pc_songplay" class="workspace">
    <div class="record"><span>♪</span></div>
    <div><div class="TrackTitleContainer_preview"><div class="title" title="夜曲">夜曲</div></div><div class="info"><p class="artist">歌手：<span title="周杰伦">周杰伦</span></p><p class="album">专辑：<span class="link" title="十一月的萧邦">十一月的萧邦</span></p></div><p class="hint">点击下方「歌曲知识」体验首次 API 配置</p></div>
  </div>
  <div class="page-footer"><div class="vinyl-page-bar-wrapper"><div class="side"><div class="left"><span class="fake-icon">♡</span><span class="fake-icon">↗</span></div></div><button class="play" title="离线展示">Ⅱ</button><div class="hint">00:42 / 03:46</div></div></div>
</div>
<div id="page_pc_setting" hidden><h2>设置 · 离线布局样本</h2><main class="right-container"><p class="hint">这里展示网易云原设置页中的新增入口。</p></main></div>
<script>
  window.demoState = {playing:{resourceTrackId:185017,resourceName:'夜曲',resourceArtists:[{name:'周杰伦'}],curTrack:{id:185017,name:'夜曲',artists:[{name:'周杰伦'}],album:{name:'十一月的萧邦'}}}};
  const moduleFactory = function(){ /* dva-tool getStore */ };
  function demoRequire(){ return {a:{getStore:()=>window.demoState}}; }
  demoRequire.m = {12:moduleFactory};
  window.webpackJsonp = [];
  window.webpackJsonp.push = parts => {const factory=Object.values(parts[1])[0];factory({}, {}, demoRequire);};
  window.demoConfig={baseUrl:'https://api.deepseek.com',model:'deepseek-flash',hasKey:false,searchEnabled:true,cacheDays:7};
  window.demoCalls=[];
  window.__ncmKnowledgeHost = payload => {
    const request=JSON.parse(payload);window.demoCalls.push(request.method);
    const delay = request.method==='song.analyze' ? (window.demoDelay || 550) : 40;
    setTimeout(()=>{
      let result;
      switch(request.method){
        case 'config.get': result={...demoConfig}; break;
        case 'config.save': demoConfig={...demoConfig,...request.params,hasKey:request.params.clearKey?false:demoConfig.hasKey||!!request.params.apiKey}; delete demoConfig.apiKey;result={...demoConfig};break;
        case 'connection.test': result={ok:true,message:'离线演示：模拟连接成功，不会发出网络请求。'};break;
        case 'cache.clear':result={ok:true};break;
        case 'song.analyze':result={song:request.params.song,text:window.demoText || '## 创作背景\n这里是**离线界面示例**，不代表这首歌曲的真实创作背景。正式查询会先检索资料，再根据来源整理事实。[1]\n\n## 歌词与典故\n有出处的创作事实与音乐解读会分别说明。资料不足时会直接提示，避免把传闻写成故事。\n\n## 音乐与文化知识\n- 了解曲式、乐器与风格的基本知识。\n- 认识音乐所涉及的文学、历史与文化背景。\n\n## 值得留意的听点\n再次聆听时，可以把注意力放在伴奏层次、旋律发展与情绪变化上。以上为通用演示文字。',sources:[{id:1,title:'演示来源：DeepSeek Search API 文档',url:'https://api-docs.deepseek.com/guides/search/'}],generatedAt:new Date().toISOString(),cached:false,searchStatus:'searched'};break;
      }
      window.__ncmKnowledgeReceive?.({id:request.id,result});
    },delay);
  };
</script>
<script src="../src/payload.js"></script>
</html>
